<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEKOIRC</title>
  <link rel="icon" type="image/png" href="https://nekosec.netlify.app/images/neko.png">
  <style>
    :root {
      --neko-accent: #00d4ff;
      --neko-accent-dim: #0066aa;
      --neko-bg: #0a0e1a;
      --neko-panel: #121828;
      --neko-panel-2: #0e1320;
      --neko-border: #1e2a44;
      --neko-text: #c8d8f0;
      --neko-red: #ff4a6a;
      --neko-yellow: #ffcc00;
      --neko-blue: #4aa8ff;
      --neko-pink: #ff6b9d;
      --neko-green: #00ff9d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--neko-bg);
      color: var(--neko-text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      user-select: none;
      position: relative;
    }

    /* ===== Animované pozadí ===== */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.06), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 102, 170, 0.06), transparent 40%),
        linear-gradient(rgba(30, 42, 68, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 42, 68, 0.3) 1px, transparent 1px);
      background-size: auto, auto, 40px 40px, 40px 40px;
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite;
    }
    @keyframes bgPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    body > * { position: relative; z-index: 1; }

    header::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neko-accent), transparent);
      opacity: 0.6;
      animation: scanLine 4s linear infinite;
    }
    @keyframes scanLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px;
      background: linear-gradient(90deg, var(--neko-panel), var(--neko-bg));
      border-bottom: 1px solid var(--neko-border);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: bold; letter-spacing: 3px; font-size: 1.1em;
      color: var(--neko-accent);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { text-shadow: 0 0 10px rgba(0, 212, 255, 0.6); }
      50% { text-shadow: 0 0 18px rgba(0, 212, 255, 1), 0 0 30px rgba(0, 212, 255, 0.5); }
    }
    .logo-img {
      height: 28px; width: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.6));
      animation: logoSpin 12s linear infinite;
    }
    @keyframes logoSpin {
      0%, 90%, 100% { transform: rotate(0deg); }
      95% { transform: rotate(15deg); }
    }
    .logo span { color: #fff; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .status {
      font-size: 0.8em; padding: 3px 10px;
      border: 1px solid var(--neko-border); border-radius: 3px;
      display: flex; align-items: center; gap: 6px;
      background: var(--neko-panel-2);
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--neko-yellow);
      animation: pulse 1.2s infinite;
    }
    .status.online .dot { background: var(--neko-green); animation: none; box-shadow: 0 0 8px var(--neko-green); }
    .status.offline .dot { background: var(--neko-red); animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }

    .icon-btn {
      background: transparent; border: 1px solid var(--neko-border);
      color: var(--neko-text); padding: 4px 10px; cursor: pointer;
      border-radius: 3px; font-family: inherit; font-size: 0.85em;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--neko-accent-dim); color: var(--neko-accent); box-shadow: 0 0 8px rgba(0, 212, 255, 0.3); }
    .icon-btn.muted { color: var(--neko-red); border-color: var(--neko-red); }

    .main { flex: 1; display: flex; overflow: hidden; }

    #sidebar {
      width: 200px; flex-shrink: 0;
      background: var(--neko-panel);
      border-right: 1px solid var(--neko-border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-section h3 {
      font-size: 0.72em; text-transform: uppercase; letter-spacing: 1px;
      padding: 8px 12px; color: var(--neko-accent-dim);
      border-bottom: 1px solid var(--neko-border);
      background: var(--neko-panel-2);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar-section h3 .add-btn {
      cursor: pointer; color: var(--neko-accent); font-size: 1.1em;
      padding: 0 4px; line-height: 1;
      transition: transform 0.2s;
    }
    .sidebar-section h3 .add-btn:hover { color: #fff; transform: scale(1.3) rotate(90deg); }
    #conversations { flex: 1; overflow-y: auto; padding: 4px 0; font-size: 0.85em; }
    .conv {
      padding: 6px 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      border-left: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }
    .conv:hover {
      background: rgba(0, 212, 255, 0.08);
      border-left-color: rgba(0, 212, 255, 0.5);
      padding-left: 16px;
    }
    .conv.active {
      background: rgba(0, 212, 255, 0.12);
      border-left-color: var(--neko-accent);
      box-shadow: inset 0 0 12px rgba(0, 212, 255, 0.1);
    }
    .conv .name { color: var(--neko-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv.active .name { color: var(--neko-accent); font-weight: bold; }
    .conv .badge {
      background: var(--neko-red); color: #fff;
      border-radius: 8px; padding: 0 6px; font-size: 0.75em;
      font-weight: bold; min-width: 18px; text-align: center;
      animation: badgePulse 1.5s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 74, 106, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 8px rgba(255, 74, 106, 0.8); }
    }
    .conv .type-icon { font-size: 0.8em; opacity: 0.6; margin-right: 4px; }
    .conv .muted-icon { opacity: 0.4; font-size: 0.75em; }

    #log {
      flex: 1; overflow-y: auto; padding: 10px 16px;
      line-height: 1.5; user-select: text;
    }
    .msg {
      margin: 1px 0; word-wrap: break-word; padding: 2px 4px; border-radius: 2px;
      animation: msgIn 0.25s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .msg .time { color: #3a4a6a; font-size: 0.8em; margin-right: 6px; }
    .msg .nick { font-weight: bold; cursor: pointer; }
    .msg .nick:hover { text-decoration: underline; }
    .msg .text { color: var(--neko-text); }
    .msg.system { color: #5a6a8a; font-style: italic; }
    .msg.error { color: var(--neko-red); animation: msgIn 0.25s ease-out, shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .msg.welcome {
      color: var(--neko-accent);
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), transparent);
      padding: 6px 8px;
      border-left: 3px solid var(--neko-accent);
      border-radius: 2px;
    }
    .msg.join { color: var(--neko-accent-dim); }
    .msg.part { color: var(--neko-yellow); }
    .msg.action { color: var(--neko-yellow); font-style: italic; }
    .msg.dm {
      background: rgba(255, 107, 157, 0.08);
      border-left: 2px solid var(--neko-pink);
      padding-left: 6px;
    }
    .msg.highlight {
      background: rgba(255, 204, 0, 0.15);
      border-left: 3px solid var(--neko-yellow);
      padding-left: 6px;
      animation: msgIn 0.25s ease-out, highlightPulse 2s ease-in-out infinite;
    }
    @keyframes highlightPulse {
      0%, 100% { background: rgba(255, 204, 0, 0.15); }
      50% { background: rgba(255, 204, 0, 0.28); }
    }
    .msg.notice { color: var(--neko-blue); }

    #users-panel {
      width: 180px; flex-shrink: 0;
      background: var(--neko-panel);
      border-left: 1px solid var(--neko-border);
      display: flex; flex-direction: column;
    }
    #users-panel h3 {
      font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px;
      padding: 8px 12px; color: var(--neko-accent-dim);
      border-bottom: 1px solid var(--neko-border);
      background: var(--neko-panel-2);
    }
    #users-list { flex: 1; overflow-y: auto; padding: 6px 0; font-size: 0.85em; }
    .user {
      padding: 3px 12px; display: flex; align-items: center; gap: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .user:hover {
      background: rgba(0, 212, 255, 0.08);
      padding-left: 16px;
    }
    .user .prefix { color: var(--neko-yellow); font-weight: bold; width: 12px; }
    .user .name { color: var(--neko-text); }
    .user.op .name { color: var(--neko-accent); font-weight: bold; }
    .user.me .name { color: var(--neko-blue); }

    #input-area {
      display: flex; gap: 8px; padding: 8px 12px;
      background: var(--neko-panel);
      border-top: 1px solid var(--neko-border);
      flex-shrink: 0;
    }
    #input {
      flex: 1; background: #000; border: 1px solid var(--neko-border);
      color: var(--neko-accent); font-family: inherit; font-size: 14px;
      padding: 8px 12px; border-radius: 3px; outline: none;
      transition: all 0.2s;
      caret-color: var(--neko-accent);
    }
    #input:focus {
      border-color: var(--neko-accent-dim);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.3), inset 0 0 8px rgba(0, 212, 255, 0.05);
    }
    #input::placeholder { color: #2a3a5a; }
    button.send-btn {
      background: var(--neko-accent-dim); color: #000;
      border: none; padding: 8px 20px; cursor: pointer;
      font-family: inherit; font-weight: bold; border-radius: 3px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    button.send-btn:hover {
      background: var(--neko-accent);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
      transform: translateY(-1px);
    }
    button.send-btn:active { transform: translateY(0); }
    button.send-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--neko-bg); }
    ::-webkit-scrollbar-thumb { background: var(--neko-border); border-radius: 4px; transition: background 0.2s; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neko-accent-dim); }

    #modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(2px);
    }
    #modal.show { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: var(--neko-panel); border: 1px solid var(--neko-accent-dim);
      padding: 24px; border-radius: 4px; min-width: 360px; max-width: 480px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-box h2 {
      color: var(--neko-accent); margin-bottom: 4px; font-size: 1.2em;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
    .modal-box .subtitle {
      color: var(--neko-accent-dim); font-size: 0.8em; margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .modal-box h3 { color: var(--neko-accent); margin-bottom: 12px; font-size: 1em; }
    .modal-box label {
      display: block; font-size: 0.78em; color: var(--neko-accent-dim);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
      margin-top: 12px;
    }
    .modal-box input {
      width: 100%; background: #000; border: 1px solid var(--neko-border);
      color: var(--neko-accent); padding: 8px 10px; font-family: inherit;
      font-size: 14px; border-radius: 3px; outline: none;
      transition: all 0.2s;
    }
    .modal-box input:focus { border-color: var(--neko-accent-dim); box-shadow: 0 0 10px rgba(0,212,255,0.25); }
    .modal-box .hint { font-size: 0.72em; color: #4a5a7a; margin-top: 4px; font-style: italic; }
    .modal-box .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal-box button {
      background: var(--neko-accent-dim); color: #000; border: none;
      padding: 8px 18px; cursor: pointer; font-family: inherit;
      font-weight: bold; border-radius: 3px;
      transition: all 0.2s;
    }
    .modal-box button:hover { background: var(--neko-accent); box-shadow: 0 0 12px rgba(0,212,255,0.5); }
    .modal-box button.cancel { background: transparent; color: var(--neko-text); border: 1px solid var(--neko-border); }
    .modal-box button.cancel:hover { border-color: var(--neko-accent-dim); color: var(--neko-accent); box-shadow: none; }
    .modal-box .checkbox-row {
      display: flex; align-items: center; gap: 8px; margin-top: 12px;
      font-size: 0.85em;
    }
    .modal-box .checkbox-row input { width: auto; }

    #context-menu {
      position: fixed;
      background: var(--neko-panel);
      border: 1px solid var(--neko-accent-dim);
      border-radius: 4px;
      padding: 4px 0;
      min-width: 190px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 10px rgba(0,212,255,0.15);
      z-index: 1000;
      display: none;
      font-size: 0.85em;
      user-select: none;
    }
    #context-menu.show { display: block; animation: ctxIn 0.15s ease-out; }
    @keyframes ctxIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    #context-menu .ctx-title {
      padding: 6px 14px 4px;
      color: var(--neko-accent-dim);
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--neko-border);
      margin-bottom: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #context-menu .ctx-item {
      padding: 7px 14px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      color: var(--neko-text);
      transition: all 0.15s;
    }
    #context-menu .ctx-item:hover {
      background: rgba(0, 212, 255, 0.12);
      color: var(--neko-accent);
      padding-left: 18px;
    }
    #context-menu .ctx-item.danger { color: var(--neko-red); }
    #context-menu .ctx-item.danger:hover { background: rgba(255, 74, 106, 0.15); color: #fff; }
    #context-menu .ctx-item .icon { width: 14px; text-align: center; opacity: 0.7; }
    #context-menu .ctx-sep { height: 1px; background: var(--neko-border); margin: 4px 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://nekosec.netlify.app/images/neko.png" alt="NEKOIRC" class="logo-img">
      NEKO<span>IRC</span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="sound-toggle" title="Zvuková oznámení">🔊 Zvuk: ON</button>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Připojování...</span></div>
    </div>
  </header>

  <div class="main">
    <aside id="sidebar">
      <div class="sidebar-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <h3>
          <span>Konverzace</span>
          <span class="add-btn" id="add-conv" title="Nový kanál nebo DM">+</span>
        </h3>
        <div id="conversations"></div>
      </div>
    </aside>

    <div id="log"></div>

    <aside id="users-panel">
      <h3>Uživatelé <span id="user-count">(0)</span></h3>
      <div id="users-list"></div>
    </aside>
  </div>

  <div id="input-area">
    <input id="input" placeholder="Napište zprávu nebo /příkaz..." autocomplete="off" spellcheck="false" disabled>
    <button class="send-btn" id="send" disabled>ODESLAT</button>
  </div>

  <div id="login-modal" class="show" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:200;">
    <div class="modal-box">
      <h2>NEKOIRC</h2>
      <div class="subtitle">Přihlášení do IRC</div>

      <label for="login-nick">Přezdívka</label>
      <input id="login-nick" placeholder="např. NEKOIRC_User" autocomplete="off" spellcheck="false" maxlength="30">
      <div class="hint">Tuto přezdívku budete používat v síti.</div>

      <div class="checkbox-row">
        <input type="checkbox" id="login-remember" checked>
        <label for="login-remember" style="margin:0; text-transform:none; letter-spacing:0; font-size:1em; color:var(--neko-text);">Zapamatovat si přezdívku</label>
      </div>

      <div class="buttons">
        <button id="login-connect">Připojit</button>
      </div>
    </div>
  </div>

  <div id="modal">
    <div class="modal-box">
      <h3 id="modal-title">Nová konverzace</h3>
      <input id="modal-input" placeholder="#kanál nebo přezdívka" autocomplete="off">
      <div class="buttons">
        <button class="cancel" id="modal-cancel">Zrušit</button>
        <button id="modal-ok">Vytvořit</button>
      </div>
    </div>
  </div>

  <div id="context-menu"></div>

  <script>
    // ========== KONFIGURACE ==========
    // ⚠️ ZMĚŇTE TOTO NA URL VAŠEHO RENDER BACKENDU!
    // Například: 'wss://nekoirc-backend.onrender.com'
    const RENDER_URL = 'wss://nekoirc-backend.onrender.com';

    const CONFIG = {
      defaultChannel: '#nekosec',
      delays: { afterOpen: 300, afterNick: 400, afterUser: 600, afterJoin: 800 }
    };

    const state = {
      myNick: null,
      currentConv: null,
      conversations: new Map(),
      channelUsers: new Map(),
      soundEnabled: true,
      inputHistory: [],
      historyIndex: -1,
      connected: false,
      joinTimeout: null,
    };

    const logEl = document.getElementById('log');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const usersListEl = document.getElementById('users-list');
    const userCountEl = document.getElementById('user-count');
    const convsEl = document.getElementById('conversations');
    const soundToggle = document.getElementById('sound-toggle');
    const modal = document.getElementById('modal');
    const modalInput = document.getElementById('modal-input');
    const modalTitle = document.getElementById('modal-title');
    const ctxMenu = document.getElementById('context-menu');

    const loginModal = document.getElementById('login-modal');
    const loginNick = document.getElementById('login-nick');
    const loginRemember = document.getElementById('login-remember');
    const loginConnect = document.getElementById('login-connect');

    // ========== ZVUK ==========
    const soundAudio = new Audio('message.mp3');
    soundAudio.preload = 'auto';
    let audioCtx = null;

    function playSound(type = 'mention') {
      if (!state.soundEnabled) return;
      try {
        soundAudio.currentTime = 0;
        const p = soundAudio.play();
        if (p && p.catch) p.catch(() => playGeneratedTone(type));
      } catch (e) { playGeneratedTone(type); }
    }

    function playGeneratedTone(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'mention') {
          osc.frequency.value = 880; osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'dm') {
          osc.frequency.value = 660; osc.type = 'triangle';
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.frequency.value = 990; osc2.type = 'triangle';
            gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.2);
          }, 120);
        } else if (type === 'error') {
          osc.frequency.value = 220; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    soundToggle.onclick = () => {
      state.soundEnabled = !state.soundEnabled;
      soundToggle.textContent = state.soundEnabled ? '🔊 Zvuk: ON' : '🔇 Zvuk: OFF';
      soundToggle.classList.toggle('muted', !state.soundEnabled);
    };

    // ========== POMOCNÉ ==========
    function now() { return new Date().toTimeString().slice(0, 8); }
    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    const nickColors = ['#00d4ff', '#4aa8ff', '#ffcc00', '#ff6b9d', '#a87bff', '#ff8c4a', '#4affd4', '#ff4a7b'];
    function nickColor(nick) {
      let hash = 0;
      for (let i = 0; i < nick.length; i++) hash = (hash * 31 + nick.charCodeAt(i)) | 0;
      return nickColors[Math.abs(hash) % nickColors.length];
    }

    function setStatus(mode, text) {
      statusEl.classList.remove('online', 'offline');
      if (mode) statusEl.classList.add(mode);
      statusTextEl.textContent = text;
    }

    function containsMyNick(text) {
      if (!state.myNick) return false;
      const escaped = state.myNick.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(^|[^a-zA-Z0-9_\\-\\[\\]\\\\\`^{}|])${escaped}([^a-zA-Z0-9_\\-\\[\\]\\\\\`^{}|]|$)`, 'i');
      return re.test(text);
    }

    // ========== KONVERZACE ==========
    function convKey(type, name) { return `${type}:${name.toLowerCase()}`; }

    function getOrCreateConv(type, name) {
      const key = convKey(type, name);
      if (!state.conversations.has(key)) {
        state.conversations.set(key, { type, name, unread: 0, messages: [], muted: false });
      }
      return state.conversations.get(key);
    }

    function switchConv(type, name) {
      const conv = getOrCreateConv(type, name);
      conv.unread = 0;
      state.currentConv = { type, name };
      logEl.innerHTML = '';
      for (const m of conv.messages) renderMessage(m, false);
      logEl.scrollTop = logEl.scrollHeight;
      renderConversations();
      document.getElementById('users-panel').style.display = type === 'channel' ? '' : 'none';
      inputEl.placeholder = type === 'channel' ? `Zpráva do ${name}...` : `Soukromá zpráva pro ${name}...`;
    }

    function renderConversations() {
      const entries = [...state.conversations.entries()].sort((a, b) => {
        if (a[1].type !== b[1].type) return a[1].type === 'channel' ? -1 : 1;
        return a[1].name.localeCompare(b[1].name);
      });
      convsEl.innerHTML = entries.map(([key, conv]) => {
        const isActive = state.currentConv &&
          state.currentConv.type === conv.type &&
          state.currentConv.name.toLowerCase() === conv.name.toLowerCase();
        const icon = conv.type === 'channel' ? '#' : '@';
        const badge = conv.unread > 0 ? `<span class="badge">${conv.unread}</span>` : '';
        const muted = conv.muted ? '<span class="muted-icon">🔇</span>' : '';
        return `<div class="conv ${isActive ? 'active' : ''}" data-key="${key}" data-type="${conv.type}" data-name="${escapeHtml(conv.name)}">
          <span class="name"><span class="type-icon">${icon}</span>${escapeHtml(conv.name)}${muted}</span>
          ${badge}
        </div>`;
      }).join('');

      convsEl.querySelectorAll('.conv').forEach(el => {
        el.onclick = () => {
          const conv = state.conversations.get(el.dataset.key);
          if (conv) switchConv(conv.type, conv.name);
        };
        el.oncontextmenu = (e) => {
          e.preventDefault(); e.stopPropagation();
          const conv = state.conversations.get(el.dataset.key);
          if (conv) showConvContextMenu(e.clientX, e.clientY, conv);
        };
      });
    }

    function pushMessage(conv, html, cls, opts = {}) {
      const msg = { html, cls, time: opts.time || now() };
      conv.messages.push(msg);
      if (conv.messages.length > 500) conv.messages.shift();
      const isActive = state.currentConv &&
        state.currentConv.type === conv.type &&
        state.currentConv.name.toLowerCase() === conv.name.toLowerCase();
      if (isActive) renderMessage(msg, true);
    }

    function renderMessage(msg, scroll = true) {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.cls || '');
      div.innerHTML = `<span class="time">${msg.time}</span>${msg.html}`;
      logEl.appendChild(div);
      if (scroll) logEl.scrollTop = logEl.scrollHeight;
    }

    // ========== PARSOVÁNÍ IRC ==========
    function parseIrc(line) {
      const msg = { prefix: null, command: null, params: [], trailing: null };
      let rest = line;
      if (rest.startsWith(':')) {
        const space = rest.indexOf(' ');
        msg.prefix = rest.slice(1, space);
        rest = rest.slice(space + 1);
      }
      const trailingIdx = rest.indexOf(' :');
      if (trailingIdx !== -1) {
        msg.trailing = rest.slice(trailingIdx + 2);
        rest = rest.slice(0, trailingIdx);
      }
      const parts = rest.split(' ').filter(Boolean);
      msg.command = parts[0];
      msg.params = parts.slice(1);
      return msg;
    }
    function nickFromPrefix(prefix) { return prefix ? prefix.split('!')[0] : ''; }

    // ========== IRC HANDLER ==========
    function handleIrcMessage(line) {
      if (line.startsWith('PING')) {
        ws.send('PONG ' + line.slice(5) + '\r\n');
        return;
      }
      const msg = parseIrc(line);
      const nick = nickFromPrefix(msg.prefix);

      switch (msg.command) {
        case '001': {
          const c = getOrCreateConv('channel', CONFIG.defaultChannel);
          pushMessage(c, `Vítejte v síti NEKOIRC, ${state.myNick}!`, 'welcome');
          break;
        }
        case '372': case '375': case '376': {
          if (state.currentConv) {
            const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
            pushMessage(c, escapeHtml(msg.trailing || ''), 'system');
          }
          break;
        }
        case '433': {
          const newNick = state.myNick + '_';
          if (state.currentConv) {
            const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
            pushMessage(c, `Přezdívka ${msg.params[1]} je obsazená, zkouším ${newNick}...`, 'error');
          }
          state.myNick = newNick;
          ws.send(`NICK ${newNick}\r\n`);
          break;
        }
        case 'JOIN': {
          const channel = msg.params[0];
          const c = getOrCreateConv('channel', channel);
          if (nick === state.myNick) {
            if (state.joinTimeout) { clearTimeout(state.joinTimeout); state.joinTimeout = null; }
            state.connected = true;
            setStatus('online', 'Online');
            pushMessage(c, `Připojen ke kanálu ${channel}`, 'join');
            switchConv('channel', channel);
            inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
          } else {
            pushMessage(c, `${nick} se připojil(a)`, 'join');
            if (channel === state.currentConv?.name) {
              state.channelUsers.set(nick, { prefix: '' });
              renderUsers();
            }
          }
          break;
        }
        case 'PART': {
          const channel = msg.params[0];
          const c = getOrCreateConv('channel', channel);
          pushMessage(c, `${nick} odešel(a)${msg.trailing ? ' (' + msg.trailing + ')' : ''}`, 'part');
          if (channel === state.currentConv?.name) {
            state.channelUsers.delete(nick);
            renderUsers();
          }
          break;
        }
        case 'QUIT': {
          for (const [key, conv] of state.conversations) {
            if (conv.type === 'channel') {
              if (conv.name === state.currentConv?.name) {
                state.channelUsers.delete(nick); renderUsers();
              }
              pushMessage(conv, `${nick} se odpojil(a)${msg.trailing ? ' (' + msg.trailing + ')' : ''}`, 'part');
            }
          }
          break;
        }
        case '353': {
          const channel = msg.params[2];
          if (channel === state.currentConv?.name) {
            const names = (msg.trailing || '').split(' ').filter(Boolean);
            for (const n of names) {
              let prefix = '', name = n;
              while (name && '@+'.includes(name[0])) { prefix = name[0]; name = name.slice(1); }
              state.channelUsers.set(name, { prefix });
            }
            renderUsers();
          }
          break;
        }
        case '366': break;
        case 'PRIVMSG': {
          const target = msg.params[0];
          const text = msg.trailing || '';
          const isChannel = target.startsWith('#');
          const convType = isChannel ? 'channel' : 'dm';
          const convName = isChannel ? target : nick;
          const conv = getOrCreateConv(convType, convName);

          const isMention = containsMyNick(text);
          const isActive = state.currentConv &&
            state.currentConv.type === convType &&
            state.currentConv.name.toLowerCase() === convName.toLowerCase();

          if (text.startsWith('\x01ACTION')) {
            const action = text.slice(8, -1);
            const cls = isMention ? 'action highlight' : 'action';
            pushMessage(conv, `<span class="nick" style="color:${nickColor(nick)}" data-nick="${escapeHtml(nick)}">* ${escapeHtml(nick)}</span> <span class="text">${escapeHtml(action)}</span>`, cls);
          } else {
            let cls = isChannel ? '' : 'dm';
            if (isMention && isChannel) cls = 'highlight';
            pushMessage(conv, `<span class="nick" style="color:${nickColor(nick)}" data-nick="${escapeHtml(nick)}">${escapeHtml(nick)}</span><span class="text">: ${escapeHtml(text)}</span>`, cls);
          }

          if (isMention || !isChannel) {
            if (!isActive || isMention) playSound(!isChannel ? 'dm' : 'mention');
          }

          if (!isActive) {
            conv.unread = (conv.unread || 0) + 1;
            renderConversations();
          }
          break;
        }
        case 'NOTICE': {
          if (state.currentConv) {
            const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
            pushMessage(c, escapeHtml(`-${nick || 'server'}- ${msg.trailing || ''}`), 'notice');
          }
          break;
        }
        case 'NICK': {
          const newNick = msg.params[0] || msg.trailing;
          if (nick === state.myNick) state.myNick = newNick;
          if (state.channelUsers.has(nick)) {
            const data = state.channelUsers.get(nick);
            state.channelUsers.delete(nick);
            state.channelUsers.set(newNick, data);
            renderUsers();
          }
          break;
        }
        case 'MODE': {
          const target = msg.params[0], modeStr = msg.params[1], modeNick = msg.params[2];
          if (target === state.currentConv?.name && modeNick) {
            const data = state.channelUsers.get(modeNick);
            if (data) {
              if (modeStr === '+o') data.prefix = '@';
              else if (modeStr === '-o') data.prefix = '';
              else if (modeStr === '+v') data.prefix = '+';
              else if (modeStr === '-v') data.prefix = '';
              renderUsers();
            }
          }
          break;
        }
        case 'ERROR': {
          if (state.currentConv) {
            const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
            pushMessage(c, escapeHtml(`Chyba serveru: ${msg.trailing || ''}`), 'error');
          }
          playSound('error');
          break;
        }
        default:
          if (msg.command && /^\d{3}$/.test(msg.command) && msg.trailing && state.currentConv) {
            const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
            pushMessage(c, escapeHtml(msg.trailing), 'system');
          }
      }
    }

    // ========== UŽIVATELÉ ==========
    function renderUsers() {
      const sorted = [...state.channelUsers.entries()].sort((a, b) => {
        const pa = a[1].prefix === '@' ? 0 : a[1].prefix === '+' ? 1 : 2;
        const pb = b[1].prefix === '@' ? 0 : b[1].prefix === '+' ? 1 : 2;
        if (pa !== pb) return pa - pb;
        return a[0].localeCompare(b[0]);
      });
      usersListEl.innerHTML = sorted.map(([name, data]) => {
        const cls = ['user'];
        if (data.prefix === '@') cls.push('op');
        if (name === state.myNick) cls.push('me');
        return `<div class="${cls.join(' ')}" data-nick="${escapeHtml(name)}">
          <span class="prefix">${data.prefix}</span>
          <span class="name">${escapeHtml(name)}</span>
        </div>`;
      }).join('');
      userCountEl.textContent = `(${sorted.length})`;

      usersListEl.querySelectorAll('.user').forEach(el => {
        el.onclick = () => {
          const n = el.dataset.nick;
          if (n && n !== state.myNick) openDM(n);
        };
        el.oncontextmenu = (e) => {
          e.preventDefault(); e.stopPropagation();
          showUserContextMenu(e.clientX, e.clientY, el.dataset.nick);
        };
      });
    }

    logEl.addEventListener('click', (e) => {
      const nickEl = e.target.closest('.nick');
      if (nickEl && nickEl.dataset.nick) {
        const n = nickEl.dataset.nick;
        if (n && n !== state.myNick && !n.startsWith('*')) openDM(n);
      }
    });

    function openDM(nick) {
      switchConv('dm', nick);
      state.conversations.get(convKey('dm', nick)).unread = 0;
      renderConversations();
    }

    // ========== KONTEXTOVÉ MENU ==========
    function hideContextMenu() {
      ctxMenu.classList.remove('show');
      ctxMenu.innerHTML = '';
    }

    function showContextMenu(x, y, title, items) {
      let html = `<div class="ctx-title">${escapeHtml(title)}</div>`;
      items.forEach((item, i) => {
        if (item === '---') { html += `<div class="ctx-sep"></div>`; return; }
        const danger = item.danger ? ' danger' : '';
        html += `<div class="ctx-item${danger}" data-idx="${i}">
          <span class="icon">${item.icon || ''}</span><span>${escapeHtml(item.label)}</span>
        </div>`;
      });
      ctxMenu.innerHTML = html;
      ctxMenu.classList.add('show');
      const rect = ctxMenu.getBoundingClientRect();
      let px = x, py = y;
      if (px + rect.width > window.innerWidth) px = window.innerWidth - rect.width - 4;
      if (py + rect.height > window.innerHeight) py = window.innerHeight - rect.height - 4;
      ctxMenu.style.left = px + 'px';
      ctxMenu.style.top = py + 'px';
      ctxMenu.querySelectorAll('.ctx-item').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const item = items[idx];
        el.onclick = () => { hideContextMenu(); if (item.action) item.action(); };
      });
    }

    document.addEventListener('click', hideContextMenu);
    document.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.conv') && !e.target.closest('.user')) hideContextMenu();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideContextMenu(); });
    logEl.addEventListener('scroll', hideContextMenu);

    function showConvContextMenu(x, y, conv) {
      const items = [];
      const isChannel = conv.type === 'channel';

      if (isChannel) {
        items.push({ icon: '💬', label: 'Otevřít', action: () => switchConv('channel', conv.name) });
        items.push({ icon: '📋', label: 'Kopírovat název', action: () => navigator.clipboard?.writeText(conv.name) });
        items.push({ icon: '🔇', label: conv.muted ? 'Zrušit ztlumení' : 'Ztlumit', action: () => {
          conv.muted = !conv.muted; renderConversations();
        }});
        items.push('---');
        items.push({ icon: '🚪', label: 'Opustit kanál (PART)', danger: true, action: () => ws.send(`PART ${conv.name}\r\n`) });
        items.push({ icon: '❌', label: 'Zavřít a odebrat', danger: true, action: () => {
          ws.send(`PART ${conv.name}\r\n`);
          state.conversations.delete(convKey(conv.type, conv.name));
          if (state.currentConv?.name === conv.name && state.currentConv?.type === conv.type) {
            state.currentConv = null; logEl.innerHTML = '';
            const first = [...state.conversations.values()][0];
            if (first) switchConv(first.type, first.name);
          }
          renderConversations();
        }});
      } else {
        items.push({ icon: '💬', label: 'Otevřít DM', action: () => switchConv('dm', conv.name) });
        items.push({ icon: '👤', label: 'WHOIS ' + conv.name, action: () => {
          ws.send(`WHOIS ${conv.name}\r\n`);
          const c = getOrCreateConv('dm', conv.name);
          pushMessage(c, `WHOIS dotaz odeslán pro ${conv.name}`, 'system');
          switchConv('dm', conv.name);
        }});
        items.push({ icon: '📋', label: 'Kopírovat přezdívku', action: () => navigator.clipboard?.writeText(conv.name) });
        items.push('---');
        items.push({ icon: '❌', label: 'Zavřít DM', danger: true, action: () => {
          state.conversations.delete(convKey(conv.type, conv.name));
          if (state.currentConv?.name === conv.name && state.currentConv?.type === conv.type) {
            state.currentConv = null; logEl.innerHTML = '';
            const first = [...state.conversations.values()][0];
            if (first) switchConv(first.type, first.name);
          }
          renderConversations();
        }});
      }
      showContextMenu(x, y, `${isChannel ? '#' : '@'} ${conv.name}`, items);
    }

    function showUserContextMenu(x, y, nick) {
      if (!nick) return;
      const isMe = nick === state.myNick;
      const items = [];

      items.push({ icon: '💬', label: 'Soukromá zpráva', action: () => { if (!isMe) openDM(nick); } });
      items.push({ icon: '👤', label: 'WHOIS ' + nick, action: () => {
        ws.send(`WHOIS ${nick}\r\n`);
        const c = getOrCreateConv('dm', nick);
        pushMessage(c, `WHOIS dotaz odeslán pro ${nick}`, 'system');
        switchConv('dm', nick);
      }});
      items.push({ icon: '📋', label: 'Kopírovat přezdívku', action: () => navigator.clipboard?.writeText(nick) });

      if (!isMe) {
        items.push('---');
        items.push({ icon: '🔇', label: 'Ignorovat (lokálně)', action: () => {
          state.ignored = state.ignored || new Set();
          state.ignored.add(nick);
        }});
      }

      const me = state.channelUsers.get(state.myNick);
      const amIOp = me && me.prefix === '@';
      if (amIOp && !isMe && state.currentConv?.type === 'channel') {
        items.push('---');
        items.push({ icon: '👑', label: 'Dát op (@)', action: () => ws.send(`MODE ${state.currentConv.name} +o ${nick}\r\n`) });
        items.push({ icon: '🎤', label: 'Dát voice (+)', action: () => ws.send(`MODE ${state.currentConv.name} +v ${nick}\r\n`) });
        items.push({ icon: '👢', label: 'Kick z kanálu', danger: true, action: () => {
          const reason = prompt(`Důvod kicku pro ${nick}:`, '');
          if (reason !== null) ws.send(`KICK ${state.currentConv.name} ${nick} :${reason}\r\n`);
        }});
      }
      showContextMenu(x, y, nick, items);
    }

    // ========== MODAL ==========
    let modalCallback = null;
    function showModal(title, placeholder, callback) {
      modalTitle.textContent = title;
      modalInput.placeholder = placeholder;
      modalInput.value = '';
      modal.classList.add('show');
      modalInput.focus();
      modalCallback = callback;
    }
    function hideModal() { modal.classList.remove('show'); modalCallback = null; }
    document.getElementById('modal-cancel').onclick = hideModal;
    document.getElementById('modal-ok').onclick = () => {
      const val = modalInput.value.trim();
      if (val && modalCallback) modalCallback(val);
      hideModal();
    };
    modalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('modal-ok').click();
      if (e.key === 'Escape') hideModal();
    });

    document.getElementById('add-conv').onclick = () => {
      showModal('Nová konverzace', '#kanál nebo přezdívka', (val) => {
        if (val.startsWith('#')) ws.send(`JOIN ${val}\r\n`);
        else openDM(val);
      });
    };

    // ========== PŘIHLÁŠOVACÍ MODAL ==========
    function showLoginModal() {
      loginModal.style.display = 'flex';
      loginNick.focus();
      try {
        const savedNick = localStorage.getItem('neko_nick');
        if (savedNick) loginNick.value = savedNick;
      } catch (e) {}
    }

    function hideLoginModal() { loginModal.style.display = 'none'; }

    function connectWith(nick, remember) {
      state.myNick = nick;
      if (remember) {
        try { localStorage.setItem('neko_nick', nick); } catch (e) {}
      } else {
        try { localStorage.removeItem('neko_nick'); } catch (e) {}
      }
      hideLoginModal();
      initWebSocket();
    }

    loginConnect.onclick = () => {
      const nick = loginNick.value.trim();
      if (!nick) { loginNick.focus(); return; }
      connectWith(nick, loginRemember.checked);
    };
    loginNick.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginConnect.click(); });

    // ========== WEBSOCKET ==========
    let ws = null;
    const sendQueue = [];
    let sendTimer = null;

    function enqueue(msg, delay = 0) {
      sendQueue.push({ msg, delay });
      processQueue();
    }
    function processQueue() {
      if (sendTimer || sendQueue.length === 0) return;
      const { msg, delay } = sendQueue.shift();
      sendTimer = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg);
        sendTimer = null;
        processQueue();
      }, delay);
    }

    function initWebSocket() {
      // Zobrazit "Probouzím server..." pokud se připojení déle nedaří
      setStatus('', 'Probouzím server...');
      const wakeTimer = setTimeout(() => {
        if (!state.connected) setStatus('', 'Server se probouzí, čekejte...');
      }, 5000);

      ws = new WebSocket(RENDER_URL);

      ws.onopen = () => {
        clearTimeout(wakeTimer);
        setStatus('', 'Přihlašování...');
        enqueue(`NICK ${state.myNick}\r\n`, CONFIG.delays.afterOpen);
        enqueue(`USER ${state.myNick} 0 * :NEKOIRC Web Terminal\r\n`, CONFIG.delays.afterNick);
        enqueue(`JOIN ${CONFIG.defaultChannel}\r\n`, CONFIG.delays.afterUser);

        state.joinTimeout = setTimeout(() => {
          if (!state.connected) {
            state.connected = true;
            setStatus('online', 'Online');
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
            const c = getOrCreateConv('channel', CONFIG.defaultChannel);
            pushMessage(c, 'Připojeno (bez potvrzení JOIN – kanál možná neexistuje).', 'system');
          }
        }, 10000);
      };
      ws.onmessage = (event) => {
        for (const line of event.data.split('\r\n')) {
          if (line) handleIrcMessage(line);
        }
      };
      ws.onclose = () => {
        clearTimeout(wakeTimer);
        if (state.joinTimeout) { clearTimeout(state.joinTimeout); state.joinTimeout = null; }
        state.connected = false;
        setStatus('offline', 'Offline');
        if (state.currentConv) {
          const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
          pushMessage(c, 'Spojení uzavřeno.', 'error');
        }
        inputEl.disabled = true; sendBtn.disabled = true;
      };
      ws.onerror = () => {
        clearTimeout(wakeTimer);
        setStatus('offline', 'Chyba');
        playSound('error');
      };
    }

    // ========== ODESÍLÁNÍ ==========
    function sendInput(e) {
      const val = inputEl.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN || !state.currentConv) return;

      if (e && e.type === 'click' && sendBtn) {
        const rect = sendBtn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        sendBtn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      }

      if (state.inputHistory[0] !== val) {
        state.inputHistory.unshift(val);
        if (state.inputHistory.length > 100) state.inputHistory.pop();
      }
      state.historyIndex = -1;

      if (val.startsWith('/')) {
        const spaceIdx = val.indexOf(' ');
        let cmd, rest;
        if (spaceIdx === -1) { cmd = val.slice(1).toUpperCase(); rest = ''; }
        else { cmd = val.slice(1, spaceIdx).toUpperCase(); rest = val.slice(spaceIdx); }

        if (cmd === 'CLEAR') {
          logEl.innerHTML = '';
          const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
          c.messages = [];
          inputEl.value = ''; return;
        }
        if (cmd === 'CLOSE') {
          const key = convKey(state.currentConv.type, state.currentConv.name);
          state.conversations.delete(key);
          state.currentConv = null;
          logEl.innerHTML = '';
          const first = [...state.conversations.values()][0];
          if (first) switchConv(first.type, first.name);
          renderConversations();
          inputEl.value = ''; return;
        }
        if (cmd === 'ME') {
          const text = rest.trim();
          if (!text) return;
          enqueue(`PRIVMSG ${state.currentConv.name} :\x01ACTION ${text}\x01\r\n`, 0);
          const c = getOrCreateConv(state.currentConv.type, state.currentConv.name);
          pushMessage(c, `<span class="nick" style="color:${nickColor(state.myNick)}">* ${escapeHtml(state.myNick)}</span> <span class="text">${escapeHtml(text)}</span>`, 'action');
          inputEl.value = ''; return;
        }
        if (cmd === 'MSG') {
          const parts = rest.trim().split(' ');
          const target = parts[0];
          const text = parts.slice(1).join(' ');
          if (target && text) {
            enqueue(`PRIVMSG ${target} :${text}\r\n`, 0);
            const c = getOrCreateConv('dm', target);
            pushMessage(c, `<span class="nick" style="color:${nickColor(state.myNick)}">${escapeHtml(state.myNick)}</span><span class="text">: ${escapeHtml(text)}</span>`, 'dm');
            if (state.currentConv?.type !== 'dm' || state.currentConv.name !== target) {
              c.unread = (c.unread || 0) + 1;
              renderConversations();
            }
          }
          inputEl.value = ''; return;
        }
        if (cmd === 'NICK') {
          state.myNick = rest.trim();
        }

        enqueue(`${cmd}${rest}\r\n`, 0);
      } else {
        if (state.currentConv.type === 'channel') {
          enqueue(`PRIVMSG ${state.currentConv.name} :${val}\r\n`, 0);
          const c = getOrCreateConv('channel', state.currentConv.name);
          pushMessage(c, `<span class="nick" style="color:${nickColor(state.myNick)}">${escapeHtml(state.myNick)}</span><span class="text">: ${escapeHtml(val)}</span>`);
        } else {
          enqueue(`PRIVMSG ${state.currentConv.name} :${val}\r\n`, 0);
          const c = getOrCreateConv('dm', state.currentConv.name);
          pushMessage(c, `<span class="nick" style="color:${nickColor(state.myNick)}">${escapeHtml(state.myNick)}</span><span class="text">: ${escapeHtml(val)}</span>`, 'dm');
        }
      }
      inputEl.value = '';
    }

    sendBtn.onclick = (e) => sendInput(e);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { sendInput(e); return; }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.historyIndex < state.inputHistory.length - 1) {
          state.historyIndex++;
          inputEl.value = state.inputHistory[state.historyIndex] || '';
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.historyIndex > 0) {
          state.historyIndex--;
          inputEl.value = state.inputHistory[state.historyIndex] || '';
        } else {
          state.historyIndex = -1;
          inputEl.value = '';
        }
      }
    });

    // ========== START ==========
    getOrCreateConv('channel', CONFIG.defaultChannel);
    state.currentConv = { type: 'channel', name: CONFIG.defaultChannel };
    renderConversations();
    showLoginModal();
  </script>
</body>
</html>
